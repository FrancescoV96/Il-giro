<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#24333f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>Il Giro</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&display=swap">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
:root {
  --bg: #eef1f4; --surface: #ffffff; --ink: #17212b; --muted: #5b6875; --line: #d5dce3;
  --road: #24333f; --road-ink: #f3f6f8; --accent: #e8a200; --accent-ink: #1d1600;
  --ok: #1f7a4d; --ok-soft: #e1f2e9; --warn: #9a5b00; --warn-soft: #fbefd6; --bad: #b3261e;
  --font-display: "Barlow Condensed", "Arial Narrow", system-ui, sans-serif;
  --font-body: "Barlow", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #11181e; --surface: #1a232b; --ink: #e8edf1; --muted: #9aa7b3; --line: #2c3842;
    --road: #0b1116; --road-ink: #e8edf1; --accent: #f2b31c; --accent-ink: #1d1600;
    --ok: #5cc994; --ok-soft: #173326; --warn: #f0b75c; --warn-soft: #3a2a10; --bad: #ff8a80;
    color-scheme: dark;
  }
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 17px; line-height: 1.45; padding-bottom: env(safe-area-inset-bottom, 0px); }
.wrap { max-width: 640px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
header { position: sticky; top: 0; z-index: 500; background: var(--road); color: var(--road-ink); padding-top: env(safe-area-inset-top, 0px); }
header .wrap { padding-block: 12px 0; }
.brand { display: flex; align-items: baseline; gap: 10px; }
.brand h1 { font-family: var(--font-display); font-size: 30px; margin: 0; letter-spacing: .02em; text-transform: uppercase; }
.brand .stripe { flex: 1; height: 4px; background: repeating-linear-gradient(90deg, var(--accent) 0 18px, transparent 18px 30px); align-self: center; }
nav { display: flex; gap: 4px; margin-top: 8px; }
nav button { flex: 1; background: transparent; color: var(--road-ink); border: 0; border-bottom: 3px solid transparent; padding: 10px 4px; font: 600 16px var(--font-body); opacity: .75; cursor: pointer; }
nav button[aria-selected="true"] { border-bottom-color: var(--accent); opacity: 1; }
main .wrap { padding-block: 16px 64px; display: grid; gap: 16px; }
h2 { font-family: var(--font-display); font-size: 22px; text-transform: uppercase; letter-spacing: .03em; margin: 0; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 16px; display: grid; gap: 12px; min-width: 0; }
.hint { color: var(--muted); font-size: 15px; margin: 0; }
.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.btn { appearance: none; border: 1px solid var(--line); background: var(--surface); color: var(--ink); font: 600 16px var(--font-body); padding: 12px 16px; border-radius: 10px; cursor: pointer; text-decoration: none; display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 48px; }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.dark { background: var(--road); color: var(--road-ink); border-color: var(--road); }
.btn.small { min-height: 38px; padding: 6px 12px; font-size: 15px; }
.btn.block { width: 100%; }
.btn.danger { color: var(--bad); }
.btn:disabled { opacity: .5; cursor: not-allowed; }
.btn:focus-visible, input:focus-visible, textarea:focus-visible, select:focus-visible, nav button:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
input, textarea, select { width: 100%; font: 400 17px var(--font-body); color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: 12px; min-width: 0; }
textarea { min-height: 120px; resize: vertical; }
label { display: grid; gap: 4px; font-weight: 600; font-size: 15px; }
label small { font-weight: 400; color: var(--muted); }
.stops { list-style: none; margin: 0; padding: 0; }
.stop { display: grid; grid-template-columns: 44px 1fr auto; gap: 12px; align-items: start; padding: 12px 0; border-top: 1px solid var(--line); }
.stop:first-child { border-top: 0; }
.num { width: 40px; height: 40px; border-radius: 50%; background: var(--road); color: var(--road-ink); display: grid; place-items: center; font: 700 20px var(--font-display); font-variant-numeric: tabular-nums; }
.num.depot { background: var(--accent); color: var(--accent-ink); font-size: 15px; }
.stop.done .num { background: var(--ok); }
.stop.done .name { text-decoration: line-through; color: var(--muted); }
.name { font-weight: 600; overflow-wrap: anywhere; }
.addr { color: var(--muted); font-size: 15px; overflow-wrap: anywhere; }
.meta { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 6px; align-items: center; }
.chip { font-size: 13px; font-weight: 600; padding: 2px 8px; border-radius: 999px; }
.chip.ok { background: var(--ok-soft); color: var(--ok); }
.chip.warn { background: var(--warn-soft); color: var(--warn); }
.chip.km { background: var(--bg); color: var(--muted); font-variant-numeric: tabular-nums; }
.side { display: grid; gap: 6px; justify-items: end; }
.iconbtn { width: 38px; height: 38px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); font-size: 18px; cursor: pointer; display: grid; place-items: center; }
.iconbtn:disabled { opacity: .35; }
.check { width: 26px; height: 26px; accent-color: var(--ok); }
.summary { display: flex; gap: 18px; flex-wrap: wrap; font-variant-numeric: tabular-nums; }
.summary b { font: 700 28px var(--font-display); display: block; line-height: 1; }
.summary span { color: var(--muted); font-size: 14px; }
.suggest { background: var(--warn-soft); border-radius: 10px; padding: 10px; display: grid; gap: 8px; font-size: 15px; }
.clist { list-style: none; margin: 0; padding: 0; }
.clist li { display: grid; grid-template-columns: 1fr auto; gap: 8px; padding: 12px 0; border-top: 1px solid var(--line); align-items: center; }
.clist li:first-child { border-top: 0; }
.empty { text-align: center; color: var(--muted); padding: 12px; }
details summary { cursor: pointer; font-weight: 600; padding: 4px 0; }
.sheet-bg { position: fixed; inset: 0; background: rgba(10,15,20,.55); z-index: 1000; display: grid; align-items: end; justify-items: center; }
.sheet { background: var(--surface); width: 100%; max-width: 640px; max-height: 92vh; overflow-y: auto; border-radius: 16px 16px 0 0; padding: 18px max(16px, env(safe-area-inset-right, 0px)) calc(18px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); display: grid; gap: 12px; }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(16px + env(safe-area-inset-bottom, 0px)); background: var(--road); color: var(--road-ink); padding: 12px 16px; border-radius: 10px; z-index: 1100; max-width: calc(100% - 32px); font-size: 15px; box-shadow: 0 6px 20px rgba(0,0,0,.25); }
.spinner { width: 18px; height: 18px; border: 3px solid currentColor; border-right-color: transparent; border-radius: 50%; animation: spin .8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
@media (prefers-reduced-motion: reduce) { .spinner { animation: none; } }
.confirm { background: var(--warn-soft); padding: 10px; border-radius: 10px; display: grid; gap: 8px; }
#map { height: 320px; border-radius: 10px; border: 1px solid var(--line); z-index: 0; }
.pin { background: var(--road); color: #fff; border: 2px solid #fff; border-radius: 50%; width: 28px; height: 28px; display: grid; place-items: center; font: 700 14px var(--font-display); box-shadow: 0 1px 4px rgba(0,0,0,.4); }
.pin.dep { background: var(--accent); color: var(--accent-ink); }
.found { background: var(--ok-soft); color: var(--ok); border-radius: 10px; padding: 8px 10px; font-size: 15px; }
.found.warn { background: var(--warn-soft); color: var(--warn); }
.picker { display: grid; gap: 8px; }
.qwrap { position: relative; }
.sug { list-style: none; margin: 4px 0 0; padding: 0; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); overflow: hidden; }
.sug:empty { display: none; }
.sug button { width: 100%; text-align: left; background: none; border: 0; border-top: 1px solid var(--line); padding: 10px 12px; font: 400 16px var(--font-body); color: var(--ink); cursor: pointer; display: grid; gap: 2px; }
.sug li:first-child button { border-top: 0; }
.sug button:hover, .sug button:focus-visible { background: var(--bg); outline: none; }
.sug .kind { font-size: 12px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }
.sug .msg { padding: 10px 12px; color: var(--muted); font-size: 15px; }
.pmap { height: 240px; border-radius: 10px; border: 1px solid var(--line); z-index: 0; }
</style>
</head>
<body>
<header>
  <div class="wrap">
    <div class="brand"><h1>Il Giro</h1><span class="stripe" aria-hidden="true"></span></div>
    <nav role="tablist">
      <button role="tab" aria-selected="true" data-view="giro">Giro di oggi</button>
      <button role="tab" aria-selected="false" data-view="clienti">Clienti</button>
      <button role="tab" aria-selected="false" data-view="impostazioni">Impostazioni</button>
    </nav>
  </div>
</header>
<main><div class="wrap" id="view"></div></main>
<div id="sheet-root"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
(() => {
"use strict";
const ORS = "https://api.openrouteservice.org";
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const uid = () => "c" + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const ls = {
  get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch { toast("Memoria del telefono piena o bloccata: i dati non sono stati salvati."); } }
};
let toastTimer;
function toast(msg) {
  let t = $(".toast"); if (!t) { t = document.createElement("div"); t.className = "toast"; t.setAttribute("role", "status"); document.body.appendChild(t); }
  t.textContent = msg; t.hidden = false; clearTimeout(toastTimer); toastTimer = setTimeout(() => t.hidden = true, 4200);
}
const norm = s => String(s || "").normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase()
  .replace(/\b(s\.?r\.?l\.?s?|s\.?n\.?c\.?|s\.?a\.?s\.?|s\.?p\.?a\.?|di|del|della|dei|da|e|il|lo|la|le|ditta|soc|societa)\b/g, " ")
  .replace(/[^a-z0-9]+/g, " ").trim();
const fmtKm = k => k.toFixed(k < 10 ? 1 : 0).replace(".", ",") + " km";
const fmtMin = s => { const m = Math.round(s / 60); return m < 60 ? m + " min" : Math.floor(m / 60) + " h " + String(m % 60).padStart(2, "0"); };

// ---------- state ----------
const DEFAULT_TRUCK = { height: 4.0, length: 12.0, width: 2.55, weight: 26, axleload: 11.5 };
const S = {
  view: "giro",
  clients: ls.get("giro.clienti", []),
  depot: ls.get("giro.deposito", null),
  key: ls.get("giro.orskey", ""),
  truck: { ...DEFAULT_TRUCK, ...ls.get("giro.camion", {}) },
  giro: ls.get("giro.oggi", { stops: [], ordered: false, route: null }),
  busy: null, confirmClear: false,
};
const saveGiro = () => ls.set("giro.oggi", S.giro);
const saveClients = () => ls.set("giro.clienti", S.clients);
const clientById = id => S.clients.find(c => c.id === id);
const hasPos = p => p && typeof p.lat === "number" && typeof p.lng === "number";

// ---------- openrouteservice ----------
async function ors(path, body) {
  if (!S.key) throw { user: "Manca la chiave openrouteservice: inseriscila in Impostazioni." };
  let res;
  try {
    res = await fetch(ORS + path, body
      ? { method: "POST", headers: { "Authorization": S.key, "Content-Type": "application/json", "Accept": "application/json, application/geo+json" }, body: JSON.stringify(body) }
      : { headers: { "Accept": "application/json" } });
  } catch { throw { user: "Nessuna connessione a internet, oppure il servizio non risponde." }; }
  if (res.status === 401 || res.status === 403) throw { user: "La chiave openrouteservice non è valida. Controllala in Impostazioni." };
  if (res.status === 429) throw { user: "Limite giornaliero del servizio raggiunto. Riprova più tardi o domani." };
  const data = await res.json().catch(() => null);
  if (!res.ok) {
    const m = data?.error?.message || data?.error || "";
    if (/routable point|could not find/i.test(m)) throw { user: "Un cliente è in un punto non raggiungibile da un camion (o la posizione è sbagliata). Controlla le posizioni.", detail: m };
    throw { user: "Il calcolo non è riuscito. Riprova tra poco.", detail: m };
  }
  return data;
}
async function geocode(p) {
  const text = [p.indirizzo, p.citta].filter(Boolean).join(", ");
  const q = new URLSearchParams({ api_key: S.key, text, "boundary.country": "IT", size: "1", lang: "it" });
  if (hasPos(S.depot)) { q.set("focus.point.lat", S.depot.lat); q.set("focus.point.lon", S.depot.lng); }
  const data = await ors("/geocode/search?" + q.toString());
  const f = data?.features?.[0]; if (!f) return null;
  const [lng, lat] = f.geometry.coordinates; const layer = f.properties.layer;
  return { lat, lng, label: f.properties.label, precise: layer === "address" || layer === "venue" || layer === "street" };
}
function restrictions() {
  const t = S.truck;
  return { height: +t.height, length: +t.length, width: +t.width, weight: +t.weight, axleload: +t.axleload };
}

// ---------- matching ----------
function similarity(a, b) {
  a = norm(a); b = norm(b); if (!a || !b) return 0;
  if (a === b) return 1;
  if (a.includes(b) || b.includes(a)) return 0.85;
  const ta = new Set(a.split(" ")), tb = new Set(b.split(" "));
  let inter = 0; ta.forEach(t => { if (tb.has(t) || [...tb].some(u => t.length > 3 && u.length > 3 && (u.startsWith(t) || t.startsWith(u)))) inter++; });
  return inter / Math.max(ta.size, tb.size);
}
function bestMatch(raw) {
  let best = null, score = 0;
  for (const c of S.clients) {
    let s = Math.max(...[c.nome, ...(c.alias || [])].map(n => similarity(raw.nome, n)));
    if (raw.citta && c.citta && norm(raw.citta) !== norm(c.citta)) s *= 0.8;
    if (s > score) { score = s; best = c; }
  }
  return { client: best, score };
}
function makeStop(raw) {
  const stop = { key: uid(), raw, clientId: null, suggestId: null, done: false };
  const { client, score } = bestMatch(raw);
  if (client && score >= 0.8) stop.clientId = client.id;
  else if (client && score >= 0.45) stop.suggestId = client.id;
  return stop;
}
const stopPlace = s => s.clientId ? clientById(s.clientId) : null;

// ---------- coordinates ----------
function parseCoords(text) {
  const t = String(text || "");
  const m = t.match(/!3d(-?\d+\.\d+)!4d(-?\d+\.\d+)/) || t.match(/@(-?\d+\.\d+),(-?\d+\.\d+)/) || t.match(/(-?\d{1,2}\.\d{3,})\s*[,; ]\s*(-?\d{1,3}\.\d{3,})/);
  if (!m) return null;
  const lat = parseFloat(m[1]), lng = parseFloat(m[2]);
  if (Math.abs(lat) > 90 || Math.abs(lng) > 180) return null;
  return { lat, lng };
}

// ---------- order: start at depot, visit all, end anywhere (on truck road times) ----------
function bestOrder(M) { // M: (n+1)x(n+1) matrix, index 0 = depot
  const n = M.length - 1; if (n <= 1) return n ? [0] : [];
  const D = (a, b) => M[a + 1][b + 1], S0 = i => M[0][i + 1];
  if (n <= 13) {
    const FULL = 1 << n, dp = new Float64Array(FULL * n).fill(Infinity), par = new Int8Array(FULL * n).fill(-1);
    for (let i = 0; i < n; i++) dp[(1 << i) * n + i] = S0(i);
    for (let m = 1; m < FULL; m++) for (let j = 0; j < n; j++) {
      const v = dp[m * n + j]; if (!(m & (1 << j)) || v === Infinity) continue;
      for (let k = 0; k < n; k++) { if (m & (1 << k)) continue; const nm = m | (1 << k), nv = v + D(j, k); if (nv < dp[nm * n + k]) { dp[nm * n + k] = nv; par[nm * n + k] = j; } }
    }
    let last = 0, m = FULL - 1; for (let j = 1; j < n; j++) if (dp[m * n + j] < dp[m * n + last]) last = j;
    const order = []; while (last !== -1) { order.push(last); const p = par[m * n + last]; m ^= (1 << last); last = p; }
    return order.reverse();
  }
  const left = new Set([...Array(n).keys()]); const order = []; let cur = -1;
  while (left.size) { let best = -1, bd = Infinity; left.forEach(i => { const d = cur < 0 ? S0(i) : D(cur, i); if (d < bd) { bd = d; best = i; } }); order.push(best); left.delete(best); cur = best; }
  const cost = o => o.reduce((s, x, i) => s + (i ? D(o[i - 1], x) : S0(x)), 0);
  let improved = true, bestC = cost(order);
  while (improved) { improved = false;
    for (let i = 0; i < n - 1; i++) for (let k = i + 1; k < n; k++) { const o = order.slice(0, i).concat(order.slice(i, k + 1).reverse(), order.slice(k + 1)); const c = cost(o); if (c + 1e-9 < bestC) { order.splice(0, n, ...o); bestC = c; improved = true; } } }
  return order;
}
async function computeRoute() {
  const places = S.giro.stops.map(stopPlace);
  const locs = [S.depot, ...places].map(p => [p.lng, p.lat]);
  const mx = await ors("/v2/matrix/driving-hgv", { locations: locs, metrics: ["duration", "distance"], units: "km" });
  const M = mx.durations.map(r => r.map(v => v == null ? 1e9 : v));
  if (M.some(r => r.some(v => v >= 1e9))) throw { user: "Uno o più clienti non sono raggiungibili su strada con il camion. Controlla le loro posizioni." };
  const order = bestOrder(M);
  S.giro.stops = order.map(i => S.giro.stops[i]);
  await refreshRoute();
}
async function refreshRoute() { // full truck route with the vehicle's limits, for the map and the totals
  const places = S.giro.stops.map(stopPlace);
  const coords = [S.depot, ...places].map(p => [p.lng, p.lat]);
  const gj = await ors("/v2/directions/driving-hgv/geojson", {
    coordinates: coords, units: "km", language: "it", instructions: false, radiuses: coords.map(() => 500),
    options: { vehicle_type: "hgv", profile_params: { restrictions: restrictions() } }
  });
  const f = gj.features[0];
  S.giro.route = {
    line: f.geometry.coordinates.map(([lng, lat]) => [+lat.toFixed(5), +lng.toFixed(5)]),
    km: f.properties.summary.distance, sec: f.properties.summary.duration,
    legs: (f.properties.segments || []).map(s => ({ km: s.distance, sec: s.duration }))
  };
  S.giro.ordered = true; saveGiro();
}

// ---------- Google Maps links ----------
const mapsLoc = p => `${p.lat.toFixed(6)},${p.lng.toFixed(6)}`;
function dirUrl(origin, list) {
  const u = new URLSearchParams({ api: "1", travelmode: "driving" });
  if (origin) u.set("origin", mapsLoc(origin));
  u.set("destination", mapsLoc(list[list.length - 1]));
  if (list.length > 1) u.set("waypoints", list.slice(0, -1).map(mapsLoc).join("|"));
  return "https://www.google.com/maps/dir/?" + u.toString();
}
function legs(origin, list) {
  const out = []; let o = origin;
  for (let i = 0; i < list.length; i += 10) { const chunk = list.slice(i, i + 10); out.push({ from: i + 1, to: i + chunk.length, url: dirUrl(o, chunk) }); o = chunk[chunk.length - 1]; }
  return out;
}
const searchUrl = p => "https://www.google.com/maps/search/?api=1&query=" + encodeURIComponent(hasPos(p) ? mapsLoc(p) : [p.indirizzo, p.citta].filter(Boolean).join(", "));

// ---------- map ----------
let map = null;
function drawMap() {
  const el = $("#map"); if (!el || !window.L || !S.giro.route) return;
  if (map) { map.remove(); map = null; }
  map = L.map(el, { zoomControl: true, attributionControl: true });
  L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", { maxZoom: 19, attribution: "© OpenStreetMap" }).addTo(map);
  const line = L.polyline(S.giro.route.line, { color: "#e8a200", weight: 6, opacity: .9 }).addTo(map);
  const icon = (txt, cls) => L.divIcon({ className: "", html: `<div class="pin ${cls}">${txt}</div>`, iconSize: [28, 28], iconAnchor: [14, 14] });
  L.marker([S.depot.lat, S.depot.lng], { icon: icon("D", "dep") }).addTo(map);
  S.giro.stops.forEach((s, i) => { const p = stopPlace(s); if (p) L.marker([p.lat, p.lng], { icon: icon(i + 1, "") }).addTo(map).bindPopup(esc(p.nome)); });
  map.fitBounds(line.getBounds(), { padding: [20, 20] });
}

// ---------- rendering ----------
function render() {
  document.querySelectorAll("nav button").forEach(b => b.setAttribute("aria-selected", String(b.dataset.view === S.view)));
  if (map) { map.remove(); map = null; }
  destroyPicker("d");
  const v = $("#view");
  v.innerHTML = S.view === "giro" ? viewGiro() : S.view === "clienti" ? viewClienti() : viewImpostazioni();

function readPlace(p) {

// ---------- location picker: suggestions + draggable pin + Google Maps links ----------
function precisionBox(precise) {
  return precise
    ? `<div class="found">Posizione precisa. Se serve, trascina il puntino sul punto di scarico.</div>`
    : `<div class="found warn">Posizione approssimativa (centro della via o del paese). Trascina il puntino o tocca la mappa sul punto esatto.</div>`;
}
const pickers = {};
function destroyPicker(p) { if (pickers[p]) { pickers[p].map.remove(); clearTimeout(pickers[p].timer); delete pickers[p]; } }
function setPin(p, lat, lng, precise, zoom) {
  const pk = pickers[p]; if (!pk) return;
  $("#" + p + "-lat").value = lat.toFixed(6); $("#" + p + "-lng").value = lng.toFixed(6);
  $("#" + p + "-precisa").value = precise ? "1" : "";
  if (!pk.marker) {
    pk.marker = L.marker([lat, lng], { draggable: true }).addTo(pk.map);
    pk.marker.on("dragend", () => { const ll = pk.marker.getLatLng(); setPin(p, ll.lat, ll.lng, true); });
  } else pk.marker.setLatLng([lat, lng]);
  if (zoom) pk.map.setView([lat, lng], zoom); else pk.map.panTo([lat, lng]);
  $("#" + p + "-found").innerHTML = precisionBox(precise);
}
function initPicker(p, d) {
  destroyPicker(p);
  const el = $("#" + p + "-map"); if (!el || !window.L) return;
  const center = hasPos(d) ? [d.lat, d.lng] : hasPos(S.depot) ? [S.depot.lat, S.depot.lng] : [41.117, 16.87];
  const m = L.map(el, { zoomControl: true });
  L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", { maxZoom: 19, attribution: "© OpenStreetMap" }).addTo(m);
  m.setView(center, hasPos(d) ? 17 : 11);
  pickers[p] = { map: m, marker: null, timer: null, seq: 0, results: [] };
  if (hasPos(d)) setPin(p, d.lat, d.lng, !!d.precisa);
  m.on("click", ev => setPin(p, ev.latlng.lat, ev.latlng.lng, true));
  setTimeout(() => m.invalidateSize(), 60);
}
const KIND = { venue: "Attività", address: "Indirizzo", street: "Via", locality: "Paese", localadmin: "Comune", neighbourhood: "Zona", county: "Provincia" };
function showSug(p, html) { const ul = $("#" + p + "-sug"); if (ul) ul.innerHTML = html; }
async function searchPlaces(p, text) {
  const pk = pickers[p]; if (!pk) return;
  const coords = parseCoords(text);
  if (coords) { setPin(p, coords.lat, coords.lng, true, 17); showSug(p, `<li class="msg">Posizione presa dalle coordinate del link.</li>`); return; }
  let q = text;
  if (/https?:\/\//i.test(text)) {
    q = text.replace(/https?:\/\/\S+/gi, " ").replace(/\s+/g, " ").trim();
    if (q.length < 3) { showSug(p, `<li class="msg">Questo link non contiene la posizione. In Google Maps copia anche nome e indirizzo del posto, oppure tieni premuto sul punto e copia le coordinate.</li>`); return; }
  }
  if (q.length < 3) { showSug(p, ""); return; }
  if (!S.key) { showSug(p, `<li class="msg">Per cercare serve la chiave in Impostazioni. Intanto puoi toccare la mappa nel punto giusto.</li>`); return; }
  const seq = ++pk.seq;
  const params = new URLSearchParams({ api_key: S.key, text: q, "boundary.country": "IT", size: "6", lang: "it", layers: "venue,address,street,locality,localadmin,neighbourhood" });
  if (hasPos(S.depot)) { params.set("focus.point.lat", S.depot.lat); params.set("focus.point.lon", S.depot.lng); }
  showSug(p, `<li class="msg">Cerco…</li>`);
  try {
    const data = await ors("/geocode/autocomplete?" + params.toString());
    if (seq !== pk.seq || !pickers[p]) return;
    pk.results = (data.features || []).map(f => ({ lng: f.geometry.coordinates[0], lat: f.geometry.coordinates[1], pr: f.properties }));
    if (!pk.results.length) { showSug(p, `<li class="msg">Nessun risultato. Prova a scrivere solo via e paese, oppure tocca la mappa nel punto giusto.</li>`); return; }
    showSug(p, pk.results.map((r, i) => `<li><button type="button" data-act="pick-sug" data-prefix="${p}" data-i="${i}"><span class="kind">${KIND[r.pr.layer] || "Luogo"}</span><span>${esc(r.pr.label)}</span></button></li>`).join(""));
  } catch (err) { if (seq === pk.seq) showSug(p, `<li class="msg">${esc(errMsg(err))}</li>`); }
}
function pickResult(p, i) {
  const pk = pickers[p], r = pk?.results[i]; if (!r) return;
  const pr = r.pr, precise = pr.layer === "venue" || pr.layer === "address";
  setPin(p, r.lat, r.lng, precise, precise ? 18 : pr.layer === "street" ? 16 : 14);
  const street = [pr.street, pr.housenumber].filter(Boolean).join(" ");
  if (street) $("#" + p + "-ind").value = street;
  const city = pr.locality || pr.localadmin || pr.county || "";
  if (city) $("#" + p + "-citta").value = city;
  const nome = $("#" + p + "-nome");
  if (nome && !nome.value.trim() && pr.layer === "venue") nome.value = pr.name;
  showSug(p, ""); $("#" + p + "-q").value = "";
}

function openPickSheet(stopKey) {
  const s = S.giro.stops.find(x => x.key === stopKey);
  const opts = [...S.clients].sort((a, b) => a.nome.localeCompare(b.nome)).map(c => `<option value="${esc(c.id)}">${esc(c.nome)}${c.citta ? " – " + esc(c.citta) : ""}</option>`).join("");
  sheetCtx = { stopKey };
  $("#sheet-root").innerHTML = `<div class="sheet-bg" data-act="sheet-close-bg"><div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-h">
    <div class="row" style="justify-content:space-between"><h2 id="sheet-h">Quale cliente è?</h2><button class="iconbtn" aria-label="Chiudi" data-act="sheet-close">✕</button></div>
    <p class="hint">Nella lista c'è scritto “${esc(s.raw.nome)}”. Scegli il cliente: ricorderò anche questo nome per le prossime volte.</p>
    <label for="pick-c">Cliente<select id="pick-c">${opts}</select></label>
    <button class="btn primary block" data-act="pick-confirm">Collega</button>
  </div></div>`;
}
const closeSheet = () => { destroyPicker("c"); $("#sheet-root").innerHTML = ""; sheetCtx = null; };
function linkStopTo(stopKey, clientId) {
  const s = S.giro.stops.find(x => x.key === stopKey); const c = clientById(clientId); if (!s || !c) return;
  s.clientId = c.id; s.suggestId = null;
  if (norm(s.raw.nome) !== norm(c.nome) && !(c.alias || []).some(a => norm(a) === norm(s.raw.nome))) { c.alias = [...(c.alias || []), s.raw.nome]; saveClients(); }
  saveGiro(); render();
}
const errMsg = e => e?.user || "Qualcosa non ha funzionato. Riprova.";

// ---------- actions ----------
document.addEventListener("click", async e => {
  const t = e.target.closest("[data-act], nav button"); if (!t) return;
  if (t.matches("nav button")) { S.view = t.dataset.view; S.confirmClear = false; render(); window.scrollTo(0, 0); return; }
  const act = t.dataset.act;
  if (act === "sheet-close-bg" && e.target !== t) return;
  const key = t.dataset.key, stop = key && S.giro.stops.find(x => x.key === key);
  switch (act) {
    case "go-imp": S.view = "impostazioni"; render(); break;
    case "manual": {
      const lines = ($("#manual-in").value || "").split(/\n+/).map(l => l.trim()).filter(Boolean);
      if (!lines.length) { toast("Scrivi almeno un cliente."); return; }
      lines.forEach(l => { const [nome, citta] = l.split(/\s+-\s+/); S.giro.stops.push(makeStop({ nome: nome.trim(), indirizzo: "", citta: (citta || "").trim() })); });
      saveGiro(); render(); break;
    }
    case "add-reg": {
      const c = clientById($("#add-reg").value); if (!c) return;
      S.giro.stops.push({ key: uid(), raw: { nome: c.nome, indirizzo: c.indirizzo, citta: c.citta }, clientId: c.id, done: false });
      saveGiro(); render(); break;
    }
    case "remove-stop": S.giro.stops = S.giro.stops.filter(x => x.key !== key); saveGiro(); render(); break;
    case "link-sug": linkStopTo(key, stop.suggestId); break;
    case "link-pick": openPickSheet(key); break;
    case "pick-confirm": { const k = sheetCtx.stopKey, id = $("#pick-c").value; closeSheet(); linkStopTo(k, id); break; }
    case "new-client": openClientSheet(null, key || null); break;
    case "edit-client": openClientSheet(clientById(t.dataset.id)); break;
    case "sheet-close": case "sheet-close-bg": closeSheet(); break;
    case "pick-sug": pickResult(t.dataset.prefix, +t.dataset.i); break;
    case "check-map": {
      const d = readPlace(t.dataset.prefix);
      if (!hasPos(d) && !d.indirizzo && !d.citta) { toast("Inserisci un indirizzo o una posizione."); return; }
      window.open(searchUrl(d), "_blank", "noopener"); break;
    }
    case "save-client": {
      const d = readPlace("c");
      if (!d.nome) { toast("Il nome è obbligatorio."); return; }
      if (!hasPos(d)) { toast("Indica dove si trova: cerca il posto oppure tocca la mappa nel punto di scarico."); $("#c-q").focus(); return; }
      const c = { id: sheetCtx.id || uid(), ...d };
      const i = S.clients.findIndex(x => x.id === c.id); if (i >= 0) S.clients[i] = c; else S.clients.push(c);
      saveClients();
      if (sheetCtx.stopKey) { const s = S.giro.stops.find(x => x.key === sheetCtx.stopKey); if (s) { s.clientId = c.id; s.suggestId = null; } }
      else S.giro.stops.forEach(s => { if (!s.clientId) { const m = bestMatch(s.raw); if (m.client && m.score >= 0.8) s.clientId = m.client.id; } });
      if (S.giro.ordered) S.giro.ordered = false;
      saveGiro(); closeSheet(); toast("Cliente salvato."); render(); break;
    }
    case "del-client": $("#del-zone").innerHTML = `<div class="confirm"><span>Eliminare questo cliente dall'anagrafica?</span><div class="row"><button class="btn small danger" data-act="del-yes">Sì, elimina</button><button class="btn small" data-act="del-no">Annulla</button></div></div>`; break;
    case "del-no": $("#del-zone").innerHTML = `<button class="btn small danger" data-act="del-client">Elimina cliente</button>`; break;
    case "del-yes": {
      const id = sheetCtx.id; S.clients = S.clients.filter(c => c.id !== id); saveClients();
      S.giro.stops.forEach(s => { if (s.clientId === id) { s.clientId = null; S.giro.ordered = false; } }); saveGiro();
      closeSheet(); toast("Cliente eliminato."); render(); break;
    }
    case "save-depot": {
      const d = readPlace("d");
      if (!hasPos(d)) { toast("Indica dove si trova il deposito: cercalo oppure tocca la mappa nel punto giusto."); return; }
      d.nome = d.nome || "Deposito"; S.depot = d; ls.set("giro.deposito", d);
      S.giro.ordered = false; saveGiro(); toast("Deposito salvato."); break;
    }
    case "save-truck": {
      const num = id => parseFloat(($("#" + id).value || "").replace(",", "."));
      const tr = { length: num("t-length"), height: num("t-height"), width: num("t-width"), weight: num("t-weight"), axleload: num("t-axle") };
      if (Object.values(tr).some(v => !(v > 0))) { toast("Controlla i valori: devono essere numeri maggiori di zero."); return; }
      S.truck = tr; ls.set("giro.camion", tr); S.giro.ordered = false; saveGiro(); toast("Camion salvato."); break;
    }
    case "save-key": {
      S.key = ($("#ors-key").value || "").trim(); ls.set("giro.orskey", S.key);
      if (!S.key) { toast("Chiave rimossa."); return; }
      t.disabled = true; t.innerHTML = '<span class="spinner"></span> Verifico…';
      try { await geocode({ citta: "Bari" }); toast("Chiave funzionante. Salvata."); } catch (err) { toast(errMsg(err)); }
      t.disabled = false; t.textContent = "Salva la chiave"; break;
    }
    case "export": {
      const blob = new Blob([JSON.stringify({ app: "il-giro", versione: 1, data: new Date().toISOString(), clienti: S.clients, deposito: S.depot, camion: S.truck }, null, 2)], { type: "application/json" });
      const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = "il-giro-copia-" + new Date().toISOString().slice(0, 10) + ".json";
      document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 2000); break;
    }
    case "calc": {
      S.busy = "calc"; render();
      try { await computeRoute(); window.scrollTo(0, 0); } catch (err) { toast(errMsg(err)); if (err?.detail) console.warn(err.detail); }
      S.busy = null; render(); break;
    }
    case "unorder": S.giro.ordered = false; S.giro.route = null; saveGiro(); render(); break;
    case "up": case "down": {
      const i = S.giro.stops.findIndex(x => x.key === key), j = act === "up" ? i - 1 : i + 1;
      if (j < 0 || j >= S.giro.stops.length) return;
      [S.giro.stops[i], S.giro.stops[j]] = [S.giro.stops[j], S.giro.stops[i]];
      S.busy = "move"; render();
      try { await refreshRoute(); } catch (err) { toast(errMsg(err)); }
      S.busy = null; saveGiro(); render(); break;
    }
    case "clear": S.confirmClear = true; render(); break;
    case "clear-no": S.confirmClear = false; render(); break;
    case "clear-yes": S.giro = { stops: [], ordered: false, route: null }; S.confirmClear = false; saveGiro(); render(); break;
  }
});
document.addEventListener("change", e => {
  if (e.target.matches('[data-act="done"]')) {
    const s = S.giro.stops.find(x => x.key === e.target.dataset.key); if (s) { s.done = e.target.checked; saveGiro(); render(); }
  }
  if (e.target.id === "import-in") {
    const f = e.target.files?.[0]; if (!f) return;
    const r = new FileReader();
    r.onload = () => {
      try {
        const d = JSON.parse(r.result);
        if (d.app !== "il-giro" || !Array.isArray(d.clienti)) throw 0;
        S.clients = d.clienti; saveClients();
        if (d.deposito) { S.depot = d.deposito; ls.set("giro.deposito", d.deposito); }
        if (d.camion) { S.truck = { ...DEFAULT_TRUCK, ...d.camion }; ls.set("giro.camion", S.truck); }
        toast(`Copia ripristinata: ${d.clienti.length} clienti.`); render();
      } catch { toast("Il file non è una copia valida de Il Giro."); }
    };
    r.readAsText(f);
  }
});
document.addEventListener("input", e => {
  if (e.target.id === "c-search") { const pos = e.target.selectionStart; render(); const n = $("#c-search"); n.focus(); n.setSelectionRange(pos, pos); }
  const qm = e.target.id.match(/^(c|d)-q$/);
  if (qm) { const p = qm[1], pk = pickers[p]; if (!pk) return; clearTimeout(pk.timer); const val = e.target.value.trim(); pk.timer = setTimeout(() => searchPlaces(p, val), parseCoords(val) || /https?:\/\//.test(val) ? 0 : 400); }
});
document.addEventListener("keydown", e => {
  if (e.key === "Escape" && sheetCtx) closeSheet();
  const qm = e.target.id?.match(/^(c|d)-q$/);
  if (qm && e.key === "Enter") { e.preventDefault(); const pk = pickers[qm[1]]; if (pk?.results.length && $("#" + qm[1] + "-sug button")) pickResult(qm[1], 0); else searchPlaces(qm[1], e.target.value.trim()); }
});

S.giro.stops.forEach(st => { if (st.clientId && !clientById(st.clientId)) { st.clientId = null; S.giro.ordered = false; } });
if (S.giro.ordered && !S.giro.route) S.giro.ordered = false;
render();
})();
</script>
</body>
</html>
